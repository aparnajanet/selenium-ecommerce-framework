name: Selenium E-Commerce CI

# This section tells GitHub to run this workflow every time code is pushed to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    # Runs the tests on a fresh, cloud-hosted Linux machine
    runs-on: ubuntu-latest

    steps:
      # 1. Pulls your code from the GitHub repository into the cloud machine
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Installs Java 21 on the cloud machine
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Executes your TestNG suite (Our BaseTest.java will detect this and use Headless Mode)
      - name: Run Maven Tests
        run: mvn clean test

      # 4. Uploads the Extent HTML Report so you can download it after the run
      - name: Upload Extent Reports (Test Results)
        uses: actions/upload-artifact@v4
        if: always() # This ensures the report is uploaded even if a test fails!
        with:
          name: Automation-Report
          path: target/ExtentReports/
          retention-days: 7